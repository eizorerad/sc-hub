[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schub"
version = "0.5.0"
description = "Single-cell pipeline hub for Slurm clusters, driven by coding agents over MCP"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7",
  "h5py>=3.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
analysis = [
  "anndata>=0.11",
  "scanpy>=1.11",
  "scvi-tools>=1.3",
  "celltypist>=1.6",
  "pydeseq2>=0.5",
  "decoupler>=2.0",
  "scikit-misc>=0.5",
  "scikit-image>=0.24",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "matplotlib>=3.8",
  "kb-python>=0.30",
  "memento-de>=0.1.3",
  "jupyterlab>=4.4",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
]
dev = ["pytest>=8", "pytest-cov>=5", "anndata>=0.11", "ipykernel>=6.29", "jupyter_client>=8.6", "nbconvert>=7"]

[project.scripts]
schub = "schub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["cluster: needs the analysis extras (scanpy, scvi-tools, ...)", "kernel: starts a real Jupyter kernel (ipykernel)"]

[tool.coverage.run]
source = ["schub"]
# pytest-of-*: a test imports a copy of the package from a temporary folder
omit = ["*/schub/bricks/impl/*", "*/schub/fetch.py", "*/schub/cellxgene_session.py", "*/pytest-of-*/*"]
