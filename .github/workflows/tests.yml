# Every pull request (fixes sent by students' assistants included) and every push to main or a
# feature branch runs the tests; the pilot owner merges a fix only when this is green.
name: tests

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: All tests
        run: python -m pytest -q -p no:cacheprovider

  setup-helper-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (for the setup-python Python and for the one `py -3` finds, which start.ps1 uses)
        run: |
          python -m pip install pytest
          py -3 -m pip install pytest
      - name: The setup helper's portable tests, through onboard\start.cmd and start.ps1
        shell: cmd
        run: onboard\start.cmd check
      - name: The dashboard mirror (schub-view.ps1) against a fake cluster
        shell: powershell
        run: .\tests\windows\check_view_mirror.ps1
